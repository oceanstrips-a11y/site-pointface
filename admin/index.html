function code(pid,ds){return (S.plans[ds]&&S.plans[ds][pid])||"";}
function setCode(pid,ds,c){(S.plans[ds]||(S.plans[ds]={}))[pid]=c;}
function info(v,p){
  if(!v) return {type:"none"};
  if(SPECIAL[v]) return {type:SPECIAL[v].type};
  const m=v.match(/^W:(\d+)-(\d+)(?:@([UB]))?$/); if(!m) return {type:"none"};
  return {type:"w",s:+m[1],e:+m[2],loc:m[3]||(p?p.locs[0]:"U")};
}
function hours(v,p){
  const k=info(v,p);
  if(k.type==="ca"||k.type==="sick") return {net:8,raw:8,brk:0};
  if(k.type!=="w") return {net:0,raw:0,brk:0};
  const dur=(k.e-k.s)/60,brk=dur>6?1:(dur>4?0.5:0);
  return {net:dur-brk,raw:dur,brk};
}
function label(v,p){
  if(!v) return "—"; if(SPECIAL[v]) return SPECIAL[v].label;
  const k=info(v,p); if(k.type!=="w") return "?";
  return fmtH(k.s)+"–"+fmtH(k.e)+(p.locs.length>1?" "+k.loc:"");
}
function optionsFor(p,cur,noLocked){
  const vals=[""];
  PRESETS.forEach(([s,e])=>{if(p.locs.length>1)p.locs.forEach(l=>vals.push(W(s,e,l)));else vals.push(W(s,e));});
  vals.push("OFF"); if(!noLocked) vals.push("REQ","CA","UNP","SICK");
  if(cur&&!vals.includes(cur)) vals.splice(1,0,cur);
  return vals.map(v=>`<option value="${v}"${v===cur?" selected":""}>${esc(label(v,p))}</option>`).join("");
}
function shiftOf(p,ds){const k=info(code(p.id,ds),p);return k.type==="w"?k:null;}
function workAt(p,ds,L){const k=shiftOf(p,ds);return k&&k.loc===L?k:null;}
function att(ds,pid){return (S.att[ds]&&S.att[ds][pid])||{};}
function setAtt(ds,pid,f,v){const d=S.att[ds]||(S.att[ds]={});(d[pid]||(d[pid]={}))[f]=v;}
function txOf(pid,ds){return S.tx.filter(t=>t.pid===pid&&t.ds===ds).sort((a,b)=>a.t-b.t);}

function breaks(ds,L){
  const sun=dowOf(fromIso(ds))===6,slots=sun?[780,840,900]:[720,780,840,900],used={},out={};
  TEAM().map(p=>({p,k:workAt(p,ds,L)})).filter(x=>x.k).sort((a,b)=>a.k.s-b.k.s).forEach(({p,k})=>{
    const h=hours(code(p.id,ds),p); if(!h.brk){out[p.id]=null;return;}
    const len=h.brk*60,ap=txOf(p.id,ds),grp=isTher(p,ds)?"t":"f";
    let best=null,bc=1e9;
    slots.forEach(s=>{if(s<k.s+120||s+len>k.e-60)return;
      const ov=ap.reduce((t,a)=>t+Math.max(0,Math.min(a.t+(a.dur||60),s+len)-Math.max(a.t,s)),0);
      const c=(used[grp+s]||0)*100+ov;if(c<bc){bc=c;best=s;}});
    if(best==null) best=Math.max(k.s+120,Math.min(k.e-len-60,780));
    used[grp+best]=(used[grp+best]||0)+1; out[p.id]={s:best,e:best+len};
  });
  return out;
}

function generatePeriod(ps,from){
  // Only days from `from` on are (re)filled; earlier days are kept as entered but still count toward hour caps.
  const days=periodDays(ps),open=ds=>!from||ds>=from;
  days.filter(open).forEach(ds=>{const w=dowOf(fromIso(ds));TEAM().forEach(p=>{if(!LOCKED[code(p.id,ds)])setCode(p.id,ds,p.tpl[w]||"OFF");});});
  function removable(p,ds){
    const k=shiftOf(p,ds); if(!k) return -1;
    const L=k.loc,w=dowOf(fromIso(ds)),R=S.rules[L]; let slack;
    if(isTher(p,ds)){
      const ther=TEAM().filter(q=>isTher(q,ds)&&workAt(q,ds,L)); slack=ther.length-R.ther[w]; if(slack<=0) return -1;
      const cl=ther.filter(q=>workAt(q,ds,L).e>=S.closeAt);
      if(k.e>=S.closeAt){if(cl.length-1<Math.min(R.close[w],R.ther[w]))return -1;const rest=cl.filter(q=>q.id!==p.id);if(rest.length===1&&!rest[0].alone)return -1;}
    } else { slack=TEAM().filter(q=>!isTher(q,ds)&&workAt(q,ds,L)).length-R.front[w]; if(slack<=0) return -1; }
    const adj=[addDays(ds,-1),addDays(ds,1)].some(x=>{const c=code(p.id,x);return c&&info(c,p).type!=="w";});
    return slack*10+(adj?5:0);
  }
  function trim(p,list,limit){let g=60;while(g--){
    if(list.reduce((t,ds)=>t+hours(code(p.id,ds),p).net,0)<=limit)return;
    let best=null,bs=-1;list.filter(open).forEach(ds=>{const s=removable(p,ds);if(s>bs){bs=s;best=ds;}});
    if(!best||bs<0)return;setCode(p.id,best,"OFF");}}
  TEAM().forEach(p=>{
    if(p.week){const wk={};days.forEach(ds=>{const k=addDays(ds,-dowOf(fromIso(ds)));(wk[k]||(wk[k]=[])).push(ds);});Object.values(wk).forEach(l=>trim(p,l,p.week));}
    if(p.target!=null) trim(p,days,p.target+(p.ot||0));
  });
}

function analyse(ps){
  const days=periodDays(ps),A=[],flags={},people={};
  const add=(lvl,t,ds)=>{A.push({lvl,t});if(ds&&lvl==="err")flags[ds]=1;};
  days.forEach(ds=>{
    const w=dowOf(fromIso(ds)),lb=dLabel(ds);
    ["U","B"].forEach(L=>{
      const R=S.rules[L],ther=TEAM().filter(p=>isTher(p,ds)&&workAt(p,ds,L)),front=TEAM().filter(p=>!isTher(p,ds)&&workAt(p,ds,L));
      const cl=ther.filter(p=>workAt(p,ds,L).e>=S.closeAt);
      if(ther.length<R.ther[w]) add("err",lb+" · "+LOCN[L]+": "+ther.length+" therapist(s), minimum "+R.ther[w],ds);
      const nc=Math.min(R.close[w],R.ther[w]);
      if(ther.length&&cl.length<nc) add("err",lb+" · "+LOCN[L]+": "+cl.length+" therapist(s) until 7 pm, minimum "+nc,ds);
      if(cl.length===1&&!cl[0].alone) add("err",lb+" · "+LOCN[L]+": "+cl[0].name+" closes alone but is not allowed to",ds);
      if(front.length<R.front[w]) add("err",lb+" · "+LOCN[L]+": no front office",ds);
    });
  });
  TEAM().forEach(p=>{
    let tot=0,raw=0,ot=0;const wk={},offs={};
    days.forEach(ds=>{const c=code(p.id,ds),h=hours(c,p);tot+=h.net;raw+=h.raw;if(info(c,p).type==="w"&&h.net>8)ot+=h.net-8;
      const k=addDays(ds,-dowOf(fromIso(ds)));wk[k]=(wk[k]||0)+h.net;(offs[k]||(offs[k]=[])).push(info(c,p).type==="w"?0:1);});
    const cap=p.target!=null?p.target+(p.ot||0):null;
    if(cap!=null&&tot>cap) add("err",p.name+": "+tot+" h this period, cap "+cap+" h");
    if(p.target!=null&&tot<p.target) add("err",p.name+": "+tot+" h, "+(p.target-tot)+" h short of "+p.target+" h");
    if(p.ot&&ot>p.ot) add("err",p.name+": "+ot+" h overtime, maximum "+p.ot+" h");
    if(p.week) Object.entries(wk).forEach(([k,v])=>{if(v>p.week)add("err",p.name+": "+v+" h in the week of "+dLabel(k)+" (max "+p.week+" h)");});
    Object.entries(offs).forEach(([k,a])=>{if(a.length===7&&a.some(x=>x)&&!a.some((x,i)=>x&&a[i+1]))add("tip",p.name+": no 2 consecutive days off in the week of "+dLabel(k));});
    people[p.id]={tot,raw,ot};
  });
  return {A,flags,people};
}

const CFG_KEYS=["cfg","rules","catalog","products","packages","checklist","mtasks","closeAt"];

function sortKeys(x){if(Array.isArray(x))return x.map(sortKeys);if(x&&typeof x==="object"){const o={};Object.keys(x).sort().forEach(k=>{if(x[k]!==undefined)o[k]=sortKeys(x[k]);});return o;}return x;}
const canon=x=>JSON.stringify(sortKeys(x));
const recKey=r=>r.kind+"|"+r.id;
function toParts(S){
  const R=new Map(),add=(kind,id,pid,ds,loc,data)=>{const r={kind,id:String(id),pid:pid||null,ds:ds||null,loc:loc||null,data};R.set(recKey(r),r);};

  for(const ds in S.att)for(const pid in S.att[ds])add("att",ds+"|"+pid,pid,ds,null,S.att[ds][pid]);
  for(const ds in S.brk)for(const pid in S.brk[ds]){const l=S.brk[ds][pid];if(l&&l.length)add("brk",ds+"|"+pid,pid,ds,null,{list:l});}

  S.sup.forEach(x=>add("sup",x.id,x.pid,x.created,x.loc,x));
  S.leave.forEach(l=>add("leave",l.id,l.pid,l.from,null,l));
  for(const ds in S.daily)add("daily",ds,null,ds,null,S.daily[ds]);
  for(const key in (S.drafts||{}))add("draft",key,null,key.slice(0,10),key.split("|")[1],S.drafts[key]);
  const C=new Map();CFG_KEYS.forEach(k=>{if(S[k]!=null)C.set(k,S[k]);});
  const T=new Map();S.staff.forEach(p=>{const {id,name,role,locs,hasLogin,userId,pin,...data}=p;T.set(id,{id,name,role,locs,data});});
  return {records:R,config:C,staff:T};
}
function fromServer(staffRows,cfgRows,recRows){
  const base=seed();base.demo=false;base.drafts={};
  base.staff=staffRows.filter(r=>r.active).map(r=>Object.assign({target:null,ot:0,week:null,alone:false,tpl:Array(7).fill("OFF")},r.data||{},{id:r.id,name:r.name,role:r.role,locs:r.locs,hasLogin:!!r.user_id,userId:r.user_id}));
  cfgRows.forEach(r=>{if(CFG_KEYS.includes(r.key)&&r.data!=null)base[r.key]=r.data;});
  recRows.forEach(r=>{const d=r.data;switch(r.kind){
    case"plan":(base.plans[r.ds]||(base.plans[r.ds]={}))[r.pid]=d.c;break;
    case"tx":case"ps":case"pk":base[r.kind].push(d);break;
    case"att":(base.att[r.ds]||(base.att[r.ds]={}))[r.pid]=d;break;
    case"brk":(base.brk[r.ds]||(base.brk[r.ds]={}))[r.pid]=d.list||[];break;
    case"photo":base.photos.push(d);break;
    case"chk":base.chk[r.id]=d;break;
    case"recap":base.recaps.push(d);break;
    case"kwh":base.kwh.push(d);break;
    case"sup":base.sup.push(d);break;
    case"leave":base.leave.push(d);break;
    case"daily":base.daily[r.id]=d;break;
    case"draft":base.drafts[r.id]=d;break;}});
  return base;
}
function syncedFrom(staffRows,cfgRows,recRows){
  const s={records:new Map(),config:new Map(),staff:new Map()};
  recRows.forEach(r=>s.records.set(recKey(r),canon({kind:r.kind,id:r.id,pid:r.pid,ds:r.ds,loc:r.loc,data:r.data})));
  cfgRows.forEach(r=>{if(r.data!=null)s.config.set(r.key,canon(r.data));});
  staffRows.filter(r=>r.active).forEach(r=>s.staff.set(r.id,canon({id:r.id,name:r.name,role:r.role,locs:r.locs,data:r.data||{}})));
  return s;
}

function errMsg(e){const m=(e&&(e.message||e.error_description||e.error))||String(e);return /fetch|network|Failed to/i.test(m)?"No connection to the server. Your change will be saved when the connection is back.":m;}
const isNetErr=e=>/fetch|network|Failed to/i.test((e&&e.message)||String(e));
function setSync(st){ui.sync=st;const el=$("syncState");if(el){el.textContent={saving:"Saving…",ok:"Saved",error:"Not saved",offline:"Offline · will retry"}[st]||"";el.className="chip "+({saving:"pend",ok:"mute",error:"warn",offline:"warn"}[st]||"mute");}}
function save(){if(!me||!S)return true;if(syncing){again=true;return true;}runSync();return true;}
async function runSync(){

  catch(e){
    if(isNetErr(e)){setSync("offline");retryT=setTimeout(()=>save(),15000);}
    else{setSync("error");toast(errMsg(e));syncing=false;try{await reload(true);}catch(x){}}
  }

async function syncOnce(){
  const cur=toParts(S),mgr=isMgr(me);
  if(mgr){
    for(const [id,r] of cur.staff){const c=canon(r);if(synced.staff.get(id)===c)continue;
      const q=synced.staff.has(id)?sb.from("staff").update({name:r.name,role:r.role,locs:r.locs,data:r.data}).eq("id",id).select("id"):sb.from("staff").insert({id,name:r.name,role:r.role,locs:r.locs,data:r.data}).select("id");
      const {data,error}=await q;if(error)throw error;if(!data.length)throw new Error("You are not allowed to change "+r.name);synced.staff.set(id,c);}
    for(const [k,d] of cur.config){const c=canon(d);if(synced.config.get(k)===c)continue;
      const {error}=await sb.from("config").upsert({key:k,data:d});if(error)throw error;synced.config.set(k,c);}
  }
  const ops=[];
  for(const [k,r] of cur.records){const c=canon(r);if(synced.records.get(k)!==c)ops.push({k,r,c,exists:synced.records.has(k)});}
  for(let i=0;i<ops.length;i+=8){
    await Promise.all(ops.slice(i,i+8).map(async o=>{const r=o.r;
      const q=o.exists?sb.from("records").update({pid:r.pid,ds:r.ds,loc:r.loc,data:r.data}).eq("kind",r.kind).eq("id",r.id).select("id"):sb.from("records").insert(r).select("id");
      const {data,error}=await q;if(error)throw error;if(!data.length)throw new Error("This change is not allowed for your account");synced.records.set(o.k,o.c);}));
  }
  for(const k of [...synced.records.keys()]){if(cur.records.has(k))continue;const i=k.indexOf("|"),kind=k.slice(0,i),id=k.slice(i+1);
    const {error}=await sb.from("records").delete().eq("kind",kind).eq("id",id);if(error)throw error;synced.records.delete(k);}
}

  if(t.status==="pending") return amtIn(t,kind)+(mgr?btn(kind,t.id,"ok","Approve","okb"):btn(kind,t.id,"checked","Checked","okb"))+btn(kind,t.id,"rejected","Reject","nob");

const ai={fn:null,img:false,ctl:null};
async function initAI(){
  ai.fn=null;ai.img=false;if(!me||!isMgr(me))return;
  try{const st=await callFn("claude",{action:"status"});if(!st||!st.enabled)return;}catch(e){return;}
  const call=async(prompt,images)=>{try{return await callFn("claude",{prompt,images});}catch(e){throw {code:/rate/i.test(e.message)?"rate_limited":"upstream_error",message:e.message};}};
  const fn=async(prompt,opts={})=>{const r=await call(prompt,[]);if(opts.onText)opts.onText({text:r.text,delta:r.text});return {text:r.text,truncated:!!r.truncated};};
  fn.json=async(prompt,opts={})=>{const imgs=opts.images?await Promise.all([...opts.images].map(toB64)):[];const r=await call(prompt+"\n\nReply with the JSON only.",imgs),t=r.text||"";
    try{return JSON.parse(t);}catch(e){const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);try{return JSON.parse(m?m[1]:t.slice(t.search(/[\[{]/),Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"))+1));}catch(e2){throw {code:"invalid_json",text:t};}}};
  ai.fn=fn;ai.img={maxCount:4};
  if(ui.view==="planning")render();

function toB64(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const m=1600,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res({media_type:"image/jpeg",data:c.toDataURL("image/jpeg",0.85).split(",")[1]});};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Unreadable image"));};img.src=url;});}
function errText(e){const m={not_granted:"Access to Claude was declined: reopen the page and allow it.",rate_limited:"Too many requests right now, try again in a few minutes.",image_rejected:"Photo refused: use a lighter JPEG or PNG.",invalid_json:"Claude could not read a schedule on this photo. Try a sharper or tighter screenshot.",session_expired:"Sign in to Claude again, then retry.",refused:"Claude could not process this request.",cancelled:"Stopped."};return m[e&&e.code]||"Something went wrong, try again.";}

async function advise(){
  if(!ai.fn)return;
  const days=periodDays(ui.period),X=analyse(ui.period);
  ui.extra=($("extraRules")||{}).value||"";
  const lines=days.map(ds=>ds+" "+DOW[dowOf(fromIso(ds))]+" | "+["U","B"].map(L=>LOCN[L]+": "+(TEAM().filter(p=>workAt(p,ds,L)).map(p=>{const k=workAt(p,ds,L);return p.name+(isTher(p,ds)?"":"(front)")+" "+fmtHH(k.s)+"-"+fmtHH(k.e);}).join(", ")||"nobody")).join(" | ")+" | off: "+(TEAM().filter(p=>!shiftOf(p,ds)).map(p=>p.name+"="+label(code(p.id,ds),p)).join(", ")||"-")).join("\n");
  const tot=TEAM().map(p=>`${p.name}: ${X.people[p.id].tot} paid h${p.target!=null?" (target "+p.target+(p.ot?" + "+p.ot+" OT max":"")+")":""}${p.week?", max "+p.week+" h/week":""}${p.alone?", may close alone":""}`).join("\n");
  const rules=["U","B"].map(L=>LOCN[L]+" — min therapists (Mon→Sun): "+S.rules[L].ther.join("/")+" ; until 7 pm: "+S.rules[L].close.join("/")+" ; front: "+S.rules[L].front.join("/")).join("\n");
  const prompt=`You help the manager of Point·Face (Korean facial studio in Bali, two studios: Ungasan and Bingin) finish the staff schedule for the pay period ${periodLabel(ui.period)}.
Rules:
- Paid hours = shift length minus the unpaid break (1 h if the shift is over 6 h, 30 min between 4 and 6 h). Annual leave and sick leave count 8 h; Off and Requested off count 0 h.
- Requested days off and leave already set are never moved.
- Opening hours: 10:00-19:00 Monday to Saturday, 12:00-19:00 on Sunday.
- Aim for 2 consecutive days off per week for everyone.
- Minimum coverage per studio:
${rules}
- A therapist closing alone must be allowed to.
${ui.extra?"Extra instructions from the manager: "+ui.extra+"\n":""}Team and current hours:
${tot}
Schedule day by day:
${lines}
Issues detected automatically:
${X.A.map(a=>(a.lvl==="err"?"[to fix] ":"[tip] ")+a.t).join("\n")||"none"}

In English, give concrete instructions to fix and finish this schedule: who to move, which day, which shift, which studio, and the effect on each person's hours. Group by priority (coverage and hour caps first, then balance and days off). End with a model break plan for a busy day in each studio. Plain text, no markdown, no table, 25 lines maximum.`;
  ai.ctl=new AbortController();$("adviceBox").hidden=false;$("adviceOut").textContent="Claude is reviewing the schedule…";$("stopAdvise").hidden=false;
  try{await ai.fn(prompt,{signal:ai.ctl.signal,cache:false,onText:({text})=>{const o=$("adviceOut");if(o)o.textContent=text;}});}
  catch(e){const o=$("adviceOut");if(o)o.textContent=(e&&e.text?e.text+"\n\n":"")+errText(e);}
  finally{const s=$("stopAdvise");if(s)s.hidden=true;}
}

const VIEWS={leave:vLeave,check:vCheck,recaps:vRecaps,supplies:vSupplies,today:vToday,month:vMonth,sched:vSched,validate:vValidate,cabins:vCabins,dash:vDash,planning:vPlanning,sc:vSC,att:vAtt,settings:vSettings};
function arm(t,txt){if(t.dataset.armed)return true;const o=t.textContent;t.dataset.armed="1";t.textContent=txt||"Confirm?";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent=o;}},3000);return false;}
const findLine=(kind,id)=>LISTS[kind]().find(x=>x.id===id);
function setLine(x,st,kind){
  const prev=x.status;x.status=st;
  if(kind!=="tx"){x.by=st==="pending"?null:me.id;return;}
  if(st==="pending"){x.by=null;x.ab=null;}
  else if(st==="checked"){if(!(prev==="ok"&&x.by))x.by=me.id;x.ab=null;}
  else if(st==="ok"){x.ab=me.id;if(!x.by)x.by=me.id;}
  else if(st==="rejected"){if(isMgr(me))x.ab=me.id;else x.by=me.id;}
}
const ACT={
  pick:t=>{const p=(ui.login||[]).find(x=>x.id===t.dataset.id);if(p)openPin(p);},
  logout:()=>logout(),
  tab:t=>{ui.view=t.dataset.v;render();window.scrollTo(0,0);},
  closeSheet:closeSheet,
  clockIn:()=>{setAtt(today(),me.id,"in",nowMin());save();render();toast("Arrival saved at "+fmtHH(nowMin()));},
  clockOut:t=>{if(!arm(t,"Confirm leaving"))return;setAtt(today(),me.id,"out",nowMin());save();render();toast("Departure saved at "+fmtHH(nowMin()));},
  openPicker:t=>{ui.pk={kind:t.dataset.kind,cat:"all",q:""};openPicker();},
  pickCat:t=>{ui.pk.cat=t.dataset.c;openPicker(true);},
  pickItem:t=>pickItem(t.dataset.id),
  delItem:t=>{if(!arm(t))return;const k=t.dataset.kind;S[k]=S[k].filter(x=>x.id!==t.dataset.id);save();render();},
  setSt:t=>{const kind=t.dataset.kind,x=findLine(kind,t.dataset.id),st=t.dataset.st;
    if(st==="ok"&&!approvable(x,kind)){toast("Another manager or owner has to approve this line.");return;}
    setLine(x,st,kind);save();render();},
  valAll:t=>{const sites=ui.vsite==="all"?["U","B"]:[ui.vsite],kind=t.dataset.kind,from=t.dataset.from,to=from==="any"?"ok":(kind==="tx"&&from==="pending"?"checked":"ok");
    LISTS[kind]().filter(x=>x.pid===t.dataset.pid&&x.ds===ui.vdate&&sites.includes(x.loc)&&(from==="any"?approvable(x,kind):x.status===from&&(to!=="ok"||approvable(x,kind)))).forEach(x=>setLine(x,to,kind));save();render();toast(to==="checked"?"Marked as checked":"Approved");},
  viewPhoto:t=>{const x=S.photos.find(p=>p.id===t.dataset.id);const p=byId(x.pid);
    sheet(`<div class="bar"><h2>${esc(p.name)} · ${dLabel(x.ds)}</h2><span class="spacer"></span><button data-act="closeSheet">Close</button></div><img src="${x.data}" alt="Cabin photo">
      <p class="note">Sent at ${fmtHH(x.t)}${x.note?" · Comment: "+esc(x.note):""}</p>
      ${canValidate(me)?`<label for="phNote">Comment for the therapist<input id="phNote" value="${esc(x.note||"")}"></label><div class="bar"><button class="okb" data-act="phSt" data-st="ok" data-id="${x.id}">Approve</button><button class="nob" data-act="phSt" data-st="redo" data-id="${x.id}">Redo</button></div>`:(x.pid===me.id&&x.status!=="ok"?`<button class="ghost" data-act="delPhoto" data-id="${x.id}">Delete this photo</button>`:"")}`,true);},
  phSt:t=>{const x=S.photos.find(p=>p.id===t.dataset.id);x.status=t.dataset.st;x.note=$("phNote").value.trim();save();closeSheet();render();},
  delPhoto:t=>{if(!arm(t))return;S.photos=S.photos.filter(p=>p.id!==t.dataset.id);save();closeSheet();render();},
  cabOk:t=>{photosOf(t.dataset.pid,ui.vdate).forEach(x=>{x.status="ok";});save();render();},
  cabRedo:t=>{const p=byId(t.dataset.pid);sheet(`<h2>${esc(p.name)}'s cabin needs redoing</h2><label for="redoNote">What needs redoing<input id="redoNote" placeholder="e.g. towels not changed, floor under the bed"></label><div class="bar"><button class="primary" data-act="cabRedoGo" data-pid="${p.id}">Send</button><button data-act="closeSheet">Cancel</button></div>`);$("redoNote").focus();},
  cabRedoGo:t=>{const n=$("redoNote").value.trim();photosOf(t.dataset.pid,ui.vdate).forEach(x=>{x.status="redo";x.note=n;});save();closeSheet();render();},
  pprev:()=>{ui.period=new Date(ui.period.getFullYear(),ui.period.getMonth()-1,26);ui.selDay=null;render();},
  pnext:()=>{ui.period=new Date(ui.period.getFullYear(),ui.period.getMonth()+1,26);ui.selDay=null;render();},
  selDay:t=>{ui.selDay=t.dataset.ds||null;render();if(ui.selDay){const b=$("dayBox");if(b)b.scrollIntoView({block:"nearest"});}},
  gen:t=>{const td=today(),days=periodDays(ui.period),from=days[0]>td?null:td;
    if(days[days.length-1]<td){toast("This period is over: enter the hours actually worked in the grid instead");return;}
    if(!arm(t,from?"Confirm: fill from today on":"Confirm: fill the period"))return;
    generatePeriod(ui.period,from);save();render();toast(from?"Draft generated from today on. Past days were kept":"Draft generated from everyone's usual week");},
  advise:advise,
  stopAdvise:()=>ai.ctl&&ai.ctl.abort(),
  applyPhoto:applyPhoto,
  cancelPhoto:()=>{ui.photoData=null;$("photoReview").hidden=true;},
  clearPeriod:t=>{if(!arm(t,"Confirm: clear"))return;periodDays(ui.period).forEach(ds=>{const d=S.plans[ds];if(d)Object.keys(d).forEach(pid=>{if(!LOCKED[d[pid]])delete d[pid];});});save();render();toast("Period cleared (leave and requested days off kept)");},
  copyPlan:()=>{const rows=[["Staff","Studio","Date","Day","Start","End","Break (h)","Paid hours","Type"]];
    periodDays(ui.period).forEach(ds=>TEAM().forEach(p=>{const c=code(p.id,ds);if(!c)return;const k=info(c,p),h=hours(c,p);rows.push([p.name,k.type==="w"?LOCN[k.loc]:"",ds,DOWL[dowOf(fromIso(ds))],k.type==="w"?fmtHH(k.s):"",k.type==="w"?fmtHH(k.e):"",h.brk,h.net,label(c,p)]);}));
    copy(rows.map(r=>r.join(";")).join("\n"),"Schedule copied: paste it into Google Sheets or Excel");},
  copySC:()=>{const r=[["Name","Role","Approved","Amount approved","Service charge","SC pending","Package bonus"]];(ui._sc.th||[]).forEach(x=>r.push([x.p.name,"Therapist",x.n,x.ca,x.sc,x.pe]));(ui._sc.fr||[]).forEach(x=>r.push([x.p.name,"Front office · products",x.n,x.ca,x.sc,x.pe]));(ui._sc.pk||[]).forEach(x=>r.push([x.p.name,"Front office · packages",x.n,x.ca,x.sc,x.pe,S.cfg.ktarget&&x.ca>=S.cfg.ktarget?(S.cfg.kbonus||0):0]));copy(r.map(x=>x.join(";")).join("\n"),"Service charge copied");},
  addStaff:()=>{const A=W(600,1140);S.staff.push({id:"p"+uid(),name:"New person",role:"therapist",locs:["U"],target:160,ot:0,week:40,alone:false,tpl:[A,A,A,A,A,"OFF","OFF"]});save();render();toast("Added: change the name, then tap Set PIN to create her login");},
  delStaff:async t=>{if(!arm(t,"Confirm: remove"))return;try{await waitSync();await callFn("admin-users",{action:"delete",staff_id:t.dataset.id});toast("Removed. Her history is kept");await reload(true);}catch(e){toast(errMsg(e));}},
  setPin:t=>{const p=byId(t.dataset.id);
    sheet(`<h2>${p.hasLogin?"Change":"Set"} ${esc(p.name)}'s PIN</h2><p class="note">6 digits. Give it to ${esc(p.name)} in person; she logs in by tapping her name.</p>
    <form id="spForm" class="form" style="grid-template-columns:1fr"><label for="spIn">New PIN<input id="spIn" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" required></label>
    <div class="bar"><button type="submit" class="primary" id="spGo">Save the PIN</button><button type="button" data-act="closeSheet">Cancel</button></div></form>`);
    $("spIn").focus();
    $("spForm").onsubmit=async e=>{e.preventDefault();const pin=$("spIn").value.trim();if(!/^\d{6}$/.test(pin)){toast("The PIN is 6 digits");return;}
      $("spGo").disabled=true;try{await waitSync();await callFn("admin-users",{action:"set_pin",staff_id:p.id,pin});closeSheet();toast("PIN saved: "+p.name+" can log in");await reload(true);}catch(x){$("spGo").disabled=false;toast(errMsg(x));}};},
  addCat:()=>{S.catalog.push({id:"c"+uid(),name:"New treatment",cat:"Add-ons",price:null,dur:60,sites:["U","B"]});save();render();},
  addProd:()=>{S.products.push({id:"pr"+uid(),brand:"COSRX",name:"New product",price:null});save();render();},
  delProd:t=>{if(!arm(t))return;S.products=S.products.filter(c=>c.id!==t.dataset.id);save();render();},
  addPack:()=>{S.packages.push({id:"k"+uid(),name:"New package",cat:"Packages",price:null,normal:null,sessions:3});save();render();},
  delPack:t=>{if(!arm(t))return;S.packages=S.packages.filter(c=>c.id!==t.dataset.id);save();render();},
  delCat:t=>{if(!arm(t))return;S.catalog=S.catalog.filter(c=>c.id!==t.dataset.id);save();render();},
  leaveSt:t=>{const l=S.leave.find(x=>x.id===t.dataset.id);if(!canDecide(l))return;const st=t.dataset.st;
    if(st==="cancelled"&&!arm(t,"Confirm cancel"))return;
    if(st==="approved")applyLeave(l,true);if(st==="cancelled"&&l.status==="approved")applyLeave(l,false);
    l.status=st;l.by=me.id;l.at=today();save();render();toast(st==="approved"?"Approved and added to the schedule":st==="cancelled"?"Cancelled and removed from the schedule":"Rejected");},
  leaveDel:t=>{if(!arm(t,"Confirm withdraw"))return;S.leave=S.leave.filter(x=>x.id!==t.dataset.id);save();render();},
  brkStart:()=>{const ds=today(),l=brkOf(ds,me.id).slice();l.push({s:nowMin(),e:null});setBrk(ds,me.id,l);save();render();toast("Break started at "+fmtHH(nowMin()));},
  brkEnd:()=>{const ds=today(),l=brkOf(ds,me.id).slice(),b=l.find(x=>x.s!=null&&x.e==null);if(b)b.e=Math.max(b.s,nowMin());
    if(b&&b.e-b.s<1){l.splice(l.indexOf(b),1);setBrk(ds,me.id,l);save();render();toast("Break under a minute: removed");return;}
    setBrk(ds,me.id,l);save();render();toast("Break ended");},
  brkAdd:()=>{const ds=today(),l=brkOf(ds,me.id).slice();if(l.length>=3)return;l.push({s:null,e:null});setBrk(ds,me.id,l);save();render();const x=$("bs-"+(l.length-1));if(x)x.focus();},
  brkDel:t=>{const ds=today(),l=brkOf(ds,me.id).slice();l.splice(+t.dataset.i,1);setBrk(ds,me.id,l);save();render();},
  mtDone:t=>{const m=S.mtasks.find(x=>x.id===t.dataset.id);m.log.push({ds:today(),t:nowMin(),by:me.id});if(m.log.length>60)m.log=m.log.slice(-60);save();render();toast("Marked as done");},
  addMt:()=>{S.mtasks.push({id:"mt"+uid(),text:"New task",log:[]});save();render();},
  delMt:t=>{if(!arm(t))return;S.mtasks=S.mtasks.filter(x=>x.id!==t.dataset.id);save();render();},
  copyRecap:t=>{const r=S.recaps.find(x=>x.id===t.dataset.id);copy(recapText(r),"Recap copied");},
  addChk:()=>{S.checklist.push({id:"k"+uid(),sec:"morning",text:"New task",sites:["U","B"],who:"front"});save();render();},
  delChk:t=>{if(!arm(t))return;S.checklist=S.checklist.filter(x=>x.id!==t.dataset.id);save();render();},
  delSup:t=>{if(!arm(t))return;S.sup=S.sup.filter(x=>x.id!==t.dataset.id);save();render();},
  supSt:t=>{const x=S.sup.find(y=>y.id===t.dataset.id);x.status=t.dataset.st;save();render();},
  copySup:t=>{const L=t.dataset.l,items=S.sup.filter(x=>x.loc===L&&x.status==="requested").sort((a,b)=>a.due.localeCompare(b.due));
    if(!items.length){toast("Nothing left to order for "+LOCN[L]);return;}
    const dues=[...new Set(items.map(x=>x.due))];
    copy("Point·Face "+LOCN[L]+" · supplies to order\n"+dues.map(d=>"\nDue "+dueLabel(d)+"\n"+items.filter(x=>x.due===d).map(x=>"- "+x.item+" × "+x.qty).join("\n")).join("\n"),"List copied");},
  resetDemo:t=>{if(!arm(t,"Confirm: erase everything"))return;const id=me.id;S=seed();save();me=byId(id)||null;render();toast("Everything erased");},
  loadSamples:t=>{if(!arm(t,"Confirm: replace with samples"))return;const id=me.id;S=seed(true);save();me=byId(id)||null;render();toast("Sample data loaded");}
};
const CH={
  brkEdit:t=>{const ds=today(),l=brkOf(ds,me.id).slice(),b=l[+t.dataset.i];if(!b)return;const m=t.value?t.value.split(":").map(Number):null;b[t.dataset.f]=m?m[0]*60+m[1]:null;
    if(b.s!=null&&b.e!=null&&b.e<=b.s){toast("The end of a break must be after its start");b[t.dataset.f]=null;}
    setBrk(ds,me.id,l);save();render();},
  mtEdit:t=>{const m=S.mtasks.find(x=>x.id===t.dataset.id);m.text=t.value;save();},
  chkT:t=>{const st=S.chk[chkKeyT(today(),me.id)]||(S.chk[chkKeyT(today(),me.id)]={});if(t.checked)st[t.dataset.id]={by:me.id,t:nowMin()};else delete st[t.dataset.id];save();render();},
  chk:t=>{const st=chkState(today(),ui.chkLoc);if(t.checked)st[t.dataset.id]={by:me.id,t:nowMin()};else delete st[t.dataset.id];save();render();},
  chkLoc:t=>{ui.chkLoc=t.value;render();},
  rcLoc:t=>{ui.rcLoc=t.value;render();},
  chkEdit:t=>{const c=S.checklist.find(x=>x.id===t.dataset.id),f=t.dataset.f;c[f]=f==="sites"?t.value.split(""):t.value;save();},
  supAll:t=>{ui.supAll=t.checked;render();},
  vdate:async t=>{ui.vdate=t.value||today();await ensurePhotos(ui.vdate);render();},
  vsite:t=>{ui.vsite=t.value;render();},
  schedDay:t=>{ui.schedDay=t.value||today();render();},
  attPerson:t=>{ui.attPerson=t.value;render();},
  daily:t=>{const d=S.daily[ui.vdate]||(S.daily[ui.vdate]={}),L=d[t.dataset.l]||(d[t.dataset.l]={});L[t.dataset.k]=t.value===""?null:+t.value;save();render();},
  amt:t=>{const x=findLine(t.dataset.kind,t.dataset.id);x.amount=Math.max(0,+t.value||0);save();},
  attEdit:t=>{const m=t.value?t.value.split(":").map(Number):null;setAtt(t.dataset.ds,t.dataset.pid,t.dataset.f,m?m[0]*60+m[1]:null);save();render();},
  cell:t=>{setCode(t.dataset.pid,t.dataset.ds,t.value);save();render();},
  tpl:t=>{byId(t.dataset.pid).tpl[+t.dataset.w]=t.value;save();},
  st:t=>{const p=byId(t.dataset.pid),f=t.dataset.f;
    if(f==="alone")p.alone=t.checked;
    else if(f==="supplies")p.supplies=t.checked;
    else if(f==="locs"){p.locs=t.value.split("");p.tpl=p.tpl.map(v=>{const m=String(v).match(/^W:(\d+)-(\d+)/);return m?W(+m[1],+m[2],p.locs.length>1?p.locs[0]:""):v;});save();render();return;}
    else if(f==="role"){p.role=t.value;if(!p.tpl)p.tpl=Array(7).fill("OFF");save();render();return;}
    else if(f==="name"||f==="pin")p[f]=t.value.trim();
    else p[f]=t.value===""?null:+t.value;
    save();},
  cat:t=>{const c=S.catalog.find(x=>x.id===t.dataset.id),f=t.dataset.f;
    if(f==="price")c.price=t.value===""?null:Math.max(0,+t.value);else if(f==="dur")c.dur=Math.max(0,+t.value||0);else if(f==="sites")c.sites=t.value.split("");else c[f]=t.value;save();},
  prod:t=>{const c=S.products.find(x=>x.id===t.dataset.id),f=t.dataset.f;c[f]=f==="price"?(t.value===""?null:Math.max(0,+t.value)):t.value;save();},
  pack:t=>{const c=S.packages.find(x=>x.id===t.dataset.id),f=t.dataset.f;c[f]=(f==="price"||f==="normal"||f==="sessions")?(t.value===""?null:Math.max(0,+t.value)):t.value;save();},
  rule:t=>{S.rules[t.dataset.l][t.dataset.k][+t.dataset.w]=Math.max(0,+t.value||0);save();},
  cfg:t=>{const v=+t.value,f=t.dataset.f;if((f==="rate"||f==="prate"||f==="krate")&&v>=0)S.cfg[f]=v/100;if(f==="ktarget"&&v>=0)S.cfg.ktarget=v;if(f==="kbonus"&&v>=0)S.cfg.kbonus=v;if((f==="div"||f==="pdiv")&&v>=1)S.cfg[f]=v;if(f==="kwhMin"&&v>=0)S.cfg.kwhMin=v;save();},
  cabin:async t=>{const files=[...t.files];t.value="";if(!files.length)return;
    toast("Sending photos…");let n=0;
    for(const f of files.slice(0,6)){try{const data=await compress(f);S.photos.push({id:uid(),pid:me.id,ds:today(),t:nowMin(),data,status:"pending",note:""});n++;}catch(e){}}
    if(!save()){S.photos.splice(S.photos.length-n,n);return;}
    render();toast(n+" photo(s) sent");},
  schedPhoto:t=>{const f=[...t.files];t.value="";if(f.length)readSchedPhotos(f);}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||!ACT[t.dataset.act])return;e.preventDefault();ACT[t.dataset.act](t,e);});
document.addEventListener("change",e=>{const t=e.target.closest("[data-ch]");if(!t||!CH[t.dataset.ch])return;CH[t.dataset.ch](t,e);});
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet();});

/* ================= utils ================= */
function sheet(h,wide){$("sheetBody").className="sheet"+(wide?" wide":"");$("sheetBody").innerHTML=h;$("sheet").hidden=false;}
function closeSheet(){$("sheet").hidden=true;$("sheetBody").innerHTML="";}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},3000);}
function copy(text,msg){
  const fb=()=>{sheet(`<h2>Copy manually</h2><p class="note">Select the text below and copy it.</p><textarea id="copyBox" rows="10" style="width:100%">${esc(text)}</textarea><div class="bar"><button data-act="closeSheet">Close</button></div>`);$("copyBox").select();};
  try{navigator.clipboard.writeText(text).then(()=>toast(msg),fb);}catch(e){fb();}
}
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const m=720,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.6));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});}

function migrate(){
  (S.recaps||[]).forEach(r=>{const v=r.v;if(v&&v.card!=null&&v.cardqr==null){v.cardqr=v.card;v.depcard=v.deposit;v.attended=v.customers;v.appts=v.customers;delete v.card;delete v.deposit;delete v.customers;}});
  if(!S.checklist)S.checklist=seedChecklist();
  if(!S.mtasks)S.mtasks=seedMTasks();
  if(S.cfg.kbonus==null)S.cfg.kbonus=350000;
  if(S.cfg.kwhMin==null)S.cfg.kwhMin=100;
  if(!S.checklist.some(x=>x.id==="e_kwh")){const i=S.checklist.findIndex(x=>x.id==="m8");S.checklist.splice(i<0?0:i,0,{id:"e_kwh",sec:"morning",text:"Enter the electricity left on the meter (kWh)",sites:["U","B"]});}
  if(!S.checklist.some(x=>x.who==="therapist"))S.checklist=S.checklist.concat(seedChecklistT());
}
function waitSync(){return new Promise(r=>{const t=()=>syncing?setTimeout(t,150):r();t();});}
async function boot(){
  if(!sb){$("app").innerHTML='<div class="login"><h1>Point·Face Team</h1><p>The page could not load. Check the internet connection and reload.</p></div>';return;}
  showLoading("Loading…");
  sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"&&me){me=null;S=null;loadLogin().then(render);}});
  try{const {data:{session}}=await sb.auth.getSession();if(session){await afterLogin(session);return;}}catch(e){toast(errMsg(e));}
  await loadLogin();render();
}
boot();
})();
</script>
