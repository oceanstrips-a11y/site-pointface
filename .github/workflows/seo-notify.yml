name: SEO – notify search engines

on:
  push:
    branches: [main]
    paths: [sitemap.xml]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Wait for GitHub Pages to deploy
        run: sleep 120
      - name: Ping IndexNow + submit sitemap to Google
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: |
          git show HEAD~1:sitemap.xml > /tmp/old_sitemap.xml 2>/dev/null || true
          python3 .github/scripts/seo_ping.py notify /tmp/old_sitemap.xml sitemap.xml
