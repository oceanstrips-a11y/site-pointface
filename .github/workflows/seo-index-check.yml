name: SEO – Google indexing check

on:
  schedule:
    - cron: '23 2 * * *'   # every day ~10:23 Bali time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Inspect recent Journal pages
        id: inspect
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: |
          set +e
          python3 .github/scripts/seo_ping.py inspect
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the alert issue
        if: steps.inspect.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Pages du Journal pas encore indexées par Google"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
