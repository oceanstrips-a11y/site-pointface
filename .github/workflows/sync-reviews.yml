name: Sync Fresha reviews

on:
  schedule:
    - cron: '17 22 * * *' # every day, 06:17 Bali time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-fresha-reviews.js
        env:
          FRESHA_URL_UNGASAN: ${{ vars.FRESHA_URL_UNGASAN }}
          FRESHA_URL_BINGIN: ${{ vars.FRESHA_URL_BINGIN }}
      - run: node scripts/build.js
      - name: Commit updated reviews
        run: |
          if git diff --quiet src/data/reviews.json; then echo "No change"; exit 0; fi
          git config user.name "reviews-bot"
          git config user.email "reviews-bot@users.noreply.github.com"
          git add src/data/reviews.json
          git commit -m "chore: sync Fresha reviews"
          git push
